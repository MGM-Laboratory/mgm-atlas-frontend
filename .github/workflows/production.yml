name: production

on:
  push:
    branches: ["main"]
    # Docs-only merges must not rebuild (and auto-redeploy) production.
    # Use "Run workflow" if you ever need to force a build.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
      - ".gitattributes"
      - ".gitignore"
      - ".editorconfig"
      - "LICENSE"
      - ".env.example"
      - "docker-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # 1) Build + push IMMUTABLE tags only. NEXT_PUBLIC_* are baked here, so the
  #    build must run un-gated — all build-time vars are repo/org level (the
  #    PMO flag was promoted out of the protected `production` environment).
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha7: ${{ steps.meta.outputs.sha }}
      ts: ${{ steps.meta.outputs.ts }}
      image: ${{ steps.img.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Compute image tag
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "app_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Resolve image name
        id: img
        run: echo "image=${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push immutable tags
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_KEYCLOAK_ISSUER=${{ vars.NEXT_PUBLIC_KEYCLOAK_ISSUER }}
            NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${{ vars.NEXT_PUBLIC_KEYCLOAK_CLIENT_ID }}
            NEXT_PUBLIC_KEYCLOAK_ACCOUNT_URL=${{ vars.NEXT_PUBLIC_KEYCLOAK_ACCOUNT_URL }}
            NEXT_PUBLIC_PMO_ENABLED=${{ vars.NEXT_PUBLIC_PMO_ENABLED }}
            NEXT_PUBLIC_YJS_WS_URL=${{ vars.NEXT_PUBLIC_YJS_WS_URL }}
            NEXT_PUBLIC_VOICE_ENABLED=${{ vars.NEXT_PUBLIC_VOICE_ENABLED }}
            NEXT_PUBLIC_LIVEKIT_URL=${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}
            GIT_SHA=${{ steps.meta.outputs.sha }}
            BUILD_TIME=${{ steps.meta.outputs.built_at }}
            APP_VERSION=${{ steps.meta.outputs.app_version }}
          tags: |
            ${{ steps.img.outputs.image }}:latest-${{ steps.meta.outputs.ts }}
            ${{ steps.img.outputs.image }}:latest-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2) APPROVAL GATE: move the floating `latest` tag (what Watchtower pulls)
  #    to the freshly-built digest. Requires a reviewer on `production`.
  release-production:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Promote digest to :latest
        run: |
          IMAGE='${{ needs.build.outputs.image }}'
          DIGEST='${{ needs.build.outputs.digest }}'
          echo "Promoting ${IMAGE}@${DIGEST} -> ${IMAGE}:latest"
          docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}@${DIGEST}"

  # 2b) Deterministic converge: after the gated retag, recreate the container
  #     on the host via compose so we don't depend on Watchtower's non-atomic
  #     update. Joins the tailnet ephemerally, then SSHes in. Inert until
  #     DEPLOY_CONVERGE_ENABLED is set — see docs/deploy-converge-setup.md.
  converge:
    needs: [build, release-production]
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_CONVERGE_ENABLED == 'true' }}
    permissions:
      contents: read
    steps:
      - name: Connect to tailnet (ephemeral node)
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Recreate frontend on the production host
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          COMPOSE_DIR: /home/user/docker/mgm-atlas-frontend
          SERVICE: atlas-frontend
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh -i "$RUNNER_TEMP/deploy_key" -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${COMPOSE_DIR}' && docker compose pull '${SERVICE}' && docker compose up -d '${SERVICE}'"

  # 3) Confirm the new SHA is serving (covers converge and the Watchtower
  #    fallback), then smoke. Runs whether converge ran or was skipped.
  verify-deploy:
    needs: [build, release-production, converge]
    if: ${{ always() && needs.release-production.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wait for production to report the new commit
        run: |
          set -euo pipefail
          want='${{ needs.build.outputs.sha7 }}'
          url='https://atlas.labmgm.org/api/version'
          echo "Waiting for $url to report sha=$want (up to 20 min)…"
          for i in $(seq 1 40); do
            got="$(curl -fsS --max-time 10 -A 'atlas-ci-verify' "$url" | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p' || true)"
            echo "[$i] reported sha=${got:-<none>}"
            if [ "$got" = "$want" ]; then echo "Converged."; exit 0; fi
            sleep 30
          done
          echo "::error::Frontend did not converge on sha=$want within 20 minutes"
          exit 1

      - name: Smoke test (key routes)
        run: |
          set -euo pipefail
          for path in / /login; do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 10 -A 'atlas-ci-smoke' "https://atlas.labmgm.org${path}")"
            echo "GET ${path} -> ${code}"
            [ "$code" = "200" ] || { echo "::error::${path} returned ${code}"; exit 1; }
          done
          echo "Smoke OK."
