# MGM Atlas — frontend deploy compose.
# The backend, Postgres, Keycloak, and n8n live elsewhere.
#
# Usage on a deploy target:
#   docker compose pull
#   docker compose up -d

services:
  atlas-frontend:
    image: ${IMAGE:-labmgm/atlas-frontend:latest}
    container_name: atlas-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
